name: Site CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build public site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-site-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-site-${{ runner.os }}-
      - name: Install locked site dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build site
        working-directory: site
        run: bun run build
